<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#90caf9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>

  <!-- Crystal/Diamond shape representing aluminium -->
  <polygon points="50,14 72,40 62,78 38,78 28,40" fill="url(#crystal)" stroke="#bbdefb" stroke-width="1.5"/>

  <!-- Facet lines -->
  <line x1="50" y1="14" x2="38" y2="78" stroke="#64b5f6" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="14" x2="62" y2="78" stroke="#64b5f6" stroke-width="1" opacity="0.6"/>
  <line x1="28" y1="40" x2="62" y2="78" stroke="#64b5f6" stroke-width="0.8" opacity="0.4"/>
  <line x1="72" y1="40" x2="38" y2="78" stroke="#64b5f6" stroke-width="0.8" opacity="0.4"/>

  <!-- Horizontal facet -->
  <line x1="28" y1="40" x2="72" y2="40" stroke="#64b5f6" stroke-width="1" opacity="0.5"/>

  <!-- Shine/highlight -->
  <polygon points="50,14 72,40 50,40" fill="url(#shine)" opacity="0.5"/>

  <!-- "C" letter -->
  <text x="50" y="60" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0d47a1" text-anchor="middle" dominant-baseline="middle" opacity="0.85">C</text>
</svg>
